<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ SkyLife License Manager</title>
    <style>
        /* ====== RESET ====== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            color: #fff;
        }

        /* ====== HEADER ====== */
        .header {
            background: linear-gradient(135deg, #0a0e27, #1a1f4e);
            padding: 30px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
        }
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo span { color: #fff; -webkit-text-fill-color: #fff; }
        .header-stats {
            display: flex;
            gap: 30px;
            font-size: 14px;
        }
        .header-stats .stat-item {
            text-align: center;
        }
        .header-stats .stat-item .num {
            font-size: 22px;
            font-weight: 700;
            color: #00d4ff;
            display: block;
        }
        .header-stats .stat-item .label {
            color: #8892b0;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ====== CONTAINER ====== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }

        /* ====== PANELS ====== */
        .panel {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 25px 30px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .panel-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #00d4ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ====== FORM ====== */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 15px;
            align-items: end;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            font-size: 12px;
            color: #8892b0;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input, .form-group select {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 14px;
            transition: all 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 30px rgba(0,212,255,0.05);
        }
        .form-group input::placeholder {
            color: #4a5070;
        }

        /* ====== BUTTONS ====== */
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: #fff;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0,212,255,0.3);
        }
        .btn-success {
            background: linear-gradient(135deg, #00ff87, #60efff);
            color: #000;
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0,255,135,0.3);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ff0040, #ff6b6b);
            color: #fff;
        }
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(255,0,64,0.3);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: #8892b0;
        }
        .btn-outline:hover {
            border-color: #00d4ff;
            color: #fff;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
        }

        /* ====== TABLE ====== */
        .table-wrapper {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            padding: 14px 16px;
            color: #8892b0;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid rgba(255,255,255,0.05);
        }
        td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 14px;
            vertical-align: middle;
        }
        tr:hover td {
            background: rgba(255,255,255,0.02);
        }

        /* ====== BADGES ====== */
        .badge {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        .badge-active {
            background: rgba(0,255,135,0.15);
            color: #00ff87;
        }
        .badge-inactive {
            background: rgba(255,255,255,0.05);
            color: #8892b0;
        }
        .badge-expired {
            background: rgba(255,200,0,0.15);
            color: #ffc800;
        }
        .badge-banned {
            background: rgba(255,0,64,0.2);
            color: #ff0040;
        }

        /* ====== SEARCH ====== */
        .search-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .search-bar input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 14px;
        }
        .search-bar input:focus {
            outline: none;
            border-color: #00d4ff;
        }
        .search-bar select {
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 14px;
            min-width: 150px;
        }
        .search-bar select:focus {
            outline: none;
            border-color: #00d4ff;
        }

        /* ====== KEY DISPLAY ====== */
        .key-display {
            margin-top: 15px;
            padding: 16px 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            color: #00d4ff;
            word-break: break-all;
            border: 1px dashed rgba(0,212,255,0.2);
            display: none;
        }
        .key-display .copy-btn {
            float: right;
            background: rgba(255,255,255,0.05);
            border: none;
            color: #8892b0;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .key-display .copy-btn:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        /* ====== TOAST ====== */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            padding: 14px 24px;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            animation: slideInRight 0.4s ease;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            min-width: 250px;
            backdrop-filter: blur(10px);
        }
        .toast-success {
            background: rgba(0,255,135,0.9);
            color: #000;
        }
        .toast-error {
            background: rgba(255,0,64,0.9);
        }
        .toast-info {
            background: rgba(0,212,255,0.9);
            color: #000;
        }
        .toast-warning {
            background: rgba(255,200,0,0.9);
            color: #000;
        }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ====== RESPONSIVE ====== */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 15px;
            }
            .header-stats {
                gap: 20px;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .search-bar {
                flex-direction: column;
            }
            .container {
                padding: 15px;
            }
            .panel {
                padding: 18px;
            }
            table {
                font-size: 12px;
            }
            th, td {
                padding: 10px 12px;
            }
        }
        @media (max-width: 480px) {
            .header-stats {
                flex-wrap: wrap;
                justify-content: center;
            }
            .header-stats .stat-item .num {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-content">
            <div class="logo">✈️ SkyLife<span>Manager</span></div>
            <div class="header-stats">
                <div class="stat-item">
                    <span class="num" id="totalCount">0</span>
                    <span class="label">Всего</span>
                </div>
                <div class="stat-item">
                    <span class="num" id="activeCount">0</span>
                    <span class="label">Активных</span>
                </div>
                <div class="stat-item">
                    <span class="num" id="expiredCount">0</span>
                    <span class="label">Истекло</span>
                </div>
                <div class="stat-item">
                    <span class="num" id="bannedCount">0</span>
                    <span class="label">Заблокировано</span>
                </div>
            </div>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <div class="container">

        <!-- Добавление лицензии -->
        <div class="panel">
            <div class="panel-title">➕ Добавить лицензию</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>ID игрока (Roblox UserId)</label>
                    <input type="number" id="playerId" placeholder="123456789">
                </div>
                <div class="form-group">
                    <label>Имя игрока</label>
                    <input type="text" id="playerName" placeholder="SkyLife_Player">
                </div>
                <div class="form-group">
                    <label>Срок (дней)</label>
                    <input type="number" id="expiryDays" value="365" min="1">
                </div>
                <div class="form-group">
                    <label>&nbsp;</label>
                    <button class="btn btn-success" onclick="addLicense()">➕ Создать</button>
                </div>
            </div>
            <div class="key-display" id="keyDisplay">
                <button class="copy-btn" onclick="copyKey()">📋 Копировать</button>
                <span id="keyText"></span>
            </div>
        </div>

        <!-- Поиск -->
        <div class="panel">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="🔍 Поиск по ID, имени или ключу..." oninput="filterTable()">
                <select id="statusFilter" onchange="filterTable()">
                    <option value="all">Все статусы</option>
                    <option value="active">✅ Активные</option>
                    <option value="inactive">⏸ Неактивные</option>
                    <option value="expired">⏰ Истекшие</option>
                    <option value="banned">🚫 Заблокированные</option>
                </select>
                <button class="btn btn-primary" onclick="refreshData()">🔄 Обновить</button>
                <button class="btn btn-outline" onclick="exportData()">📤 Экспорт</button>
            </div>

            <!-- Таблица -->
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Игрок</th>
                            <th>Лицензионный ключ</th>
                            <th>Статус</th>
                            <th>Создана</th>
                            <th>Истекает</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="licensesTable">
                        <tr><td colspan="7" style="text-align:center;color:#4a5070;padding:50px;">Загрузка данных...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- ===== TOASTS ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== SCRIPT ===== -->
    <script>
        // =====================================================
        // КОНФИГУРАЦИЯ
        // =====================================================
        // !!! ЗАМЕНИ НА СВОЙ DEPLOYMENT ID ОТ GOOGLE APPS SCRIPT !!!
        const DEPLOYMENT_ID = 'AKfycbyQrX2UycjmFGvdQDLdVHrMEAfsYMarGU57AIYnWFnqdOpgJtd2UMKqR78yDWvBEWU';
        const API_URL = 'https://script.google.com/macros/s/' + DEPLOYMENT_ID + '/exec';

        let licenses = [];
        let generatedKey = '';

        // =====================================================
        // ЗАГРУЗКА
        // =====================================================
        async function loadLicenses() {
            try {
                const res = await fetch(API_URL + '?action=getAll');
                const data = await res.json();

                if (data.success) {
                    licenses = data.data || [];
                    renderTable(licenses);
                    updateStats(licenses);
                } else {
                    showToast('❌ ' + (data.error || 'Ошибка загрузки'), 'error');
                }
            } catch (e) {
                showToast('❌ Ошибка соединения с сервером', 'error');
                console.error(e);
            }
        }

        // =====================================================
        // ОТРИСОВКА
        // =====================================================
        function renderTable(data) {
            const tbody = document.getElementById('licensesTable');

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:#4a5070;padding:40px;">📭 Нет лицензий</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(l => `
                <tr>
                    <td style="font-size:12px;color:#8892b0;">${l.id || '-'}</td>
                    <td>
                        <strong>${l.playerName || 'Unknown'}</strong>
                        <br><span style="color:#4a5070;font-size:12px;">ID: ${l.playerId}</span>
                    </td>
                    <td style="font-family:monospace;font-size:13px;color:#00d4ff;">
                        ${l.licenseKey || '-'}
                    </td>
                    <td>
                        <span class="badge badge-${l.status}">
                            ${l.status === 'active' ? '✅ Активна' :
                              l.status === 'inactive' ? '⏸ Неактивна' :
                              l.status === 'expired' ? '⏰ Истекла' :
                              l.status === 'banned' ? '🚫 Заблокирована' : l.status}
                        </span>
                    </td>
                    <td style="font-size:13px;color:#8892b0;">${l.createdAt || '-'}</td>
                    <td style="font-size:13px;color:#8892b0;">${l.expiresAt || '-'}</td>
                    <td>
                        <button class="btn btn-primary btn-sm" onclick="toggleLicense('${l.id}')">
                            ${l.status === 'active' ? '⏸' : '▶'}
                        </button>
                        <button class="btn btn-danger btn-sm" onclick="deleteLicense('${l.id}')">🗑</button>
                    </td>
                </tr>
            `).join('');
        }

        // =====================================================
        // СТАТИСТИКА
        // =====================================================
        function updateStats(data) {
            document.getElementById('totalCount').textContent = data.length;
            document.getElementById('activeCount').textContent = data.filter(l => l.status === 'active').length;
            document.getElementById('expiredCount').textContent = data.filter(l => l.status === 'expired').length;
            document.getElementById('bannedCount').textContent = data.filter(l => l.status === 'banned').length;
        }

        // =====================================================
        // ФИЛЬТРАЦИЯ
        // =====================================================
        function filterTable() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;

            const filtered = licenses.filter(l => {
                const match = (l.playerId && l.playerId.toString().includes(search)) ||
                              (l.playerName && l.playerName.toLowerCase().includes(search)) ||
                              (l.licenseKey && l.licenseKey.toLowerCase().includes(search));
                const matchStatus = status === 'all' || l.status === status;
                return match && matchStatus;
            });

            renderTable(filtered);
        }

        // =====================================================
        // ДОБАВЛЕНИЕ
        // =====================================================
        async function addLicense() {
            const playerId = document.getElementById('playerId').value.trim();
            const playerName = document.getElementById('playerName').value.trim() || 'Player_' + playerId;
            const expiryDays = parseInt(document.getElementById('expiryDays').value) || 365;

            if (!playerId) {
                showToast('❌ Введите ID игрока!', 'error');
                return;
            }

            const licenseKey = generateKey(playerId);

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'add',
                        playerId: parseInt(playerId),
                        playerName: playerName,
                        licenseKey: licenseKey,
                        expiryDays: expiryDays
                    })
                });

                const data = await res.json();

                if (data.success) {
                    generatedKey = licenseKey;
                    document.getElementById('keyText').textContent = '🔑 ' + licenseKey;
                    document.getElementById('keyDisplay').style.display = 'block';

                    document.getElementById('playerId').value = '';
                    document.getElementById('playerName').value = '';

                    showToast('✅ Лицензия создана!', 'success');
                    loadLicenses();

                    // Автоматически скопировать
                    navigator.clipboard?.writeText(licenseKey);
                } else {
                    showToast('❌ ' + (data.error || 'Ошибка'), 'error');
                }
            } catch (e) {
                showToast('❌ Ошибка соединения', 'error');
                console.error(e);
            }
        }

        // =====================================================
        // ГЕНЕРАЦИЯ КЛЮЧА
        // =====================================================
        function generateKey(playerId) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            const parts = [];
            for (let i = 0; i < 4; i++) {
                let part = '';
                for (let j = 0; j < 4; j++) {
                    part += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                parts.push(part);
            }
            const hash = (playerId * 9301 + 49297) % 233280;
            const check = String.fromCharCode(65 + (hash % 26));
            return 'SKY-' + parts.join('-') + '-' + check;
        }

        // =====================================================
        // КОПИРОВАТЬ
        // =====================================================
        function copyKey() {
            const text = document.getElementById('keyText').textContent.replace('🔑 ', '');
            navigator.clipboard?.writeText(text);
            showToast('📋 Ключ скопирован!', 'success');
        }

        // =====================================================
        // ИЗМЕНЕНИЕ СТАТУСА
        // =====================================================
        async function toggleLicense(id) {
            if (!confirm('Изменить статус лицензии?')) return;

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'toggle', id: id })
                });

                const data = await res.json();

                if (data.success) {
                    showToast('✅ Статус изменён', 'success');
                    loadLicenses();
                } else {
                    showToast('❌ ' + (data.error || 'Ошибка'), 'error');
                }
            } catch (e) {
                showToast('❌ Ошибка соединения', 'error');
            }
        }

        // =====================================================
        // УДАЛЕНИЕ
        // =====================================================
        async function deleteLicense(id) {
            if (!confirm('🗑 Удалить лицензию навсегда?')) return;

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'delete', id: id })
                });

                const data = await res.json();

                if (data.success) {
                    showToast('🗑 Лицензия удалена', 'success');
                    loadLicenses();
                } else {
                    showToast('❌ ' + (data.error || 'Ошибка'), 'error');
                }
            } catch (e) {
                showToast('❌ Ошибка соединения', 'error');
            }
        }

        // =====================================================
        // ОБНОВЛЕНИЕ
        // =====================================================
        function refreshData() {
            loadLicenses();
            showToast('🔄 Данные обновлены', 'info');
        }

        // =====================================================
        // ЭКСПОРТ
        // =====================================================
        function exportData() {
            const data = licenses.map(l => ({
                id: l.id,
                playerId: l.playerId,
                playerName: l.playerName,
                licenseKey: l.licenseKey,
                status: l.status,
                createdAt: l.createdAt,
                expiresAt: l.expiresAt
            }));
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'skylife_licenses_' + new Date().toISOString().split('T')[0] + '.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast('📤 Экспорт выполнен', 'success');
        }

        // =====================================================
        // TOAST
        // =====================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(50px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // =====================================================
        // ЗАПУСК
        // =====================================================
        loadLicenses();
        setInterval(refreshData, 60000); // обновление каждую минуту
    </script>

</body>
</html>
