<!DOCTYPE html>
<html>
<head>
    <title>Whitelist Control</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f4ff; }
        .card { background: white; padding: 20px; border-radius: 12px; margin: 10px 0; border: 1px solid #dce8f5; }
        .btn { padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; }
        .btn-yes { background: #00aa55; color: white; }
        .btn-no { background: #ff3344; color: white; }
        .tag { background: #e6effa; padding: 4px 12px; border-radius: 20px; display: inline-block; margin: 4px; }
    </style>
</head>
<body>

<h1>✈️ AirbusA220 KITTED - Whitelist</h1>

<div id="notifications">
    <h3>📬 Уведомления</h3>
    <div id="notifList"></div>
</div>

<div id="whitelistPanel">
    <h3>🔐 Whitelist</h3>
    <div id="whitelistList"></div>
    <input type="text" id="whitelistInput" placeholder="Имя пользователя">
    <button onclick="addWhitelist()">Добавить</button>
</div>

<script>
// ============================================
// ЛОКАЛЬНОЕ ХРАНИЛИЩЕ
// ============================================

let notifications = [];
let whitelist = ['Admin', 'Player_123', 'Bober_Pro'];

// Загрузка из localStorage
function loadData() {
    try {
        const saved = localStorage.getItem('whitelist_data');
        if (saved) {
            const data = JSON.parse(saved);
            notifications = data.notifications || [];
            whitelist = data.whitelist || ['Admin'];
        }
    } catch(e) {}
}

// Сохранение в localStorage
function saveData() {
    localStorage.setItem('whitelist_data', JSON.stringify({ notifications, whitelist }));
}

loadData();
renderAll();

// ============================================
// API ДЛЯ ROBLOX (имитация)
// ============================================

// Эндпоинт для уведомлений
window.notify = function(data) {
    const notif = {
        id: Date.now(),
        username: data.username || 'Unknown',
        userId: data.userId || '0',
        ip: data.ip || '127.0.0.1',
        model: data.model || 'AirbusA220KITTED',
        time: new Date().toLocaleString(),
        processed: false
    };
    notifications.unshift(notif);
    saveData();
    renderAll();
    return { success: true };
};

// Эндпоинт для whitelist
window.getWhitelist = function() {
    return whitelist;
};

// Эндпоинт для приветствия
window.getHello = function() {
    return { message: '👋 Добро пожаловать, пилот!' };
};

// ============================================
// ОТОБРАЖЕНИЕ
// ============================================

function renderAll() {
    renderNotifications();
    renderWhitelist();
}

function renderNotifications() {
    const container = document.getElementById('notifList');
    if (notifications.length === 0) {
        container.innerHTML = '<p style="color:#999;">Нет уведомлений</p>';
        return;
    }
    
    let html = '';
    notifications.forEach((n, i) => {
        const isInWhitelist = whitelist.includes(n.username);
        html += `
            <div class="card">
                <strong>@${n.username}</strong> 
                ${isInWhitelist ? '✅' : '⚠️'}
                <span style="color:#999;font-size:12px;">${n.time}</span>
                <div style="font-size:13px;color:#666;margin:6px 0;">
                    IP: ${n.ip} | UserId: ${n.userId}
                </div>
                <div>
                    <button class="btn btn-yes" onclick="handleAction(${i}, 'yes')">✅ YES</button>
                    <button class="btn btn-no" onclick="handleAction(${i}, 'no')">❌ NO</button>
                </div>
            </div>
        `;
    });
    container.innerHTML = html;
}

function renderWhitelist() {
    const container = document.getElementById('whitelistList');
    let html = '';
    whitelist.forEach(name => {
        html += `<span class="tag">@${name} <span style="cursor:pointer;color:red;" onclick="removeWhitelist('${name}')">✕</span></span>`;
    });
    container.innerHTML = html || '<span style="color:#999;">Список пуст</span>';
}

function handleAction(index, action) {
    const notif = notifications[index];
    if (!notif) return;
    
    if (action === 'yes') {
        if (!whitelist.includes(notif.username)) {
            whitelist.push(notif.username);
        }
        alert(`✅ ${notif.username} добавлен в whitelist!`);
    } else {
        alert(`❌ Доступ отклонён для ${notif.username}! Скрипты удалены.`);
    }
    
    notif.processed = true;
    saveData();
    renderAll();
}

function addWhitelist() {
    const input = document.getElementById('whitelistInput');
    const name = input.value.trim();
    if (!name) return alert('Введите имя!');
    if (whitelist.includes(name)) return alert('Уже в списке!');
    whitelist.push(name);
    saveData();
    renderAll();
    input.value = '';
}

function removeWhitelist(name) {
    if (!confirm(`Удалить ${name}?`)) return;
    whitelist = whitelist.filter(n => n !== name);
    saveData();
    renderAll();
}

// ============================================
// ТЕСТОВОЕ УВЕДОМЛЕНИЕ
// ============================================

setTimeout(() => {
    window.notify({
        username: 'Test_User_' + Math.floor(Math.random() * 1000),
        userId: '12345',
        ip: '192.168.1.1',
        model: 'AirbusA220KITTED'
    });
}, 2000);

console.log('[CRACKED] Сайт запущен!');
console.log('[CRACKED] Используй window.notify() для отправки уведомлений.');
</script>

</body>
</html>
