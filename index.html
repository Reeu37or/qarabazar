<!DOCTYPE html>
<html>
<head>
    <title>Whitelist Control</title>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #f0f4ff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #0044cc, #0088ff); padding: 20px 30px; border-radius: 16px; color: white; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .card { background: white; padding: 20px; border-radius: 12px; margin: 12px 0; border: 1px solid #dce8f5; }
        .card .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .card .username { font-weight: 700; color: #003399; font-size: 17px; }
        .card .time { color: #7799bb; font-size: 13px; }
        .card .details { margin: 8px 0 12px 0; padding: 10px; background: #f5f9ff; border-radius: 8px; font-size: 14px; color: #445566; }
        .btn { padding: 8px 24px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: all 0.2s; font-size: 14px; }
        .btn-yes { background: #00aa55; color: white; }
        .btn-yes:hover { background: #00994d; }
        .btn-no { background: #ff3344; color: white; }
        .btn-no:hover { background: #e62e3d; }
        .tag { background: #e6effa; padding: 6px 16px; border-radius: 30px; display: inline-block; margin: 4px; font-size: 14px; color: #003399; }
        .tag .remove { cursor: pointer; color: #ff3344; font-weight: 700; margin-left: 10px; }
        .whitelist-add { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .whitelist-add input { flex: 1; min-width: 180px; padding: 10px 16px; border: 2px solid #dce8f5; border-radius: 8px; font-size: 14px; outline: none; }
        .whitelist-add input:focus { border-color: #0044cc; }
        .btn-blue { background: #0044cc; color: white; padding: 10px 28px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .btn-blue:hover { background: #0033aa; }
        .empty { text-align: center; color: #99aabb; padding: 40px 0; font-size: 15px; }
        .status-dot { width: 10px; height: 10px; background: #00ff88; border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .badge { background: #00aa55; color: white; font-size: 11px; padding: 2px 12px; border-radius: 20px; margin-left: 10px; font-weight: 600; }
        .badge.no { background: #ff3344; }
        .notification-sound { background: #fff5f0; border-color: #ffccaa; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>✈️ AirbusA220 <span style="font-weight:300;opacity:0.8;">KITTED</span></h1>
        <div>
            <span class="status-dot"></span>
            <span style="margin-left:8px;font-size:14px;opacity:0.9;">Whitelist Active</span>
        </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h2 style="color:#003399;">📬 Уведомления</h2>
        <span style="color:#7799bb;font-size:14px;" id="notifCount">0</span>
    </div>
    <div id="notifList"></div>

    <div style="margin-top:30px;background:white;padding:20px;border-radius:12px;border:1px solid #dce8f5;">
        <h3 style="color:#003399;">🔐 Whitelist</h3>
        <div id="whitelistList" style="margin:10px 0;"></div>
        <div class="whitelist-add">
            <input type="text" id="whitelistInput" placeholder="Введите имя пользователя...">
            <button class="btn-blue" onclick="addWhitelist()">➕ Добавить</button>
        </div>
    </div>

    <div style="margin-top:20px;background:white;padding:20px;border-radius:12px;border:1px solid #dce8f5;">
        <h3 style="color:#003399;">✉️ Приветствие (Hello)</h3>
        <input type="text" id="helloInput" placeholder="Введите текст приветствия..." style="width:100%;padding:12px;border:2px solid #dce8f5;border-radius:8px;font-size:14px;margin:10px 0;outline:none;">
        <div style="padding:12px 18px;background:#f5f9ff;border-radius:8px;color:#003399;font-weight:600;font-size:16px;" id="helloPreview">👋 Добро пожаловать!</div>
        <button class="btn-blue" style="margin-top:10px;" onclick="saveHello()">💾 Сохранить</button>
    </div>
</div>

<script>
// ============================================
// ДАННЫЕ
// ============================================

let notifications = [];
let whitelist = ['Admin', 'Player_123'];
let helloMessage = '👋 Добро пожаловать в AirbusA220KITTED!';

function loadData() {
    try {
        const saved = localStorage.getItem('whitelist_data');
        if (saved) {
            const data = JSON.parse(saved);
            notifications = data.notifications || [];
            whitelist = data.whitelist || ['Admin'];
            helloMessage = data.helloMessage || '👋 Добро пожаловать в AirbusA220KITTED!';
        }
    } catch(e) {}
}

function saveData() {
    localStorage.setItem('whitelist_data', JSON.stringify({ notifications, whitelist, helloMessage }));
}

loadData();

// ============================================
// API
// ============================================

window.notify = function(data) {
    const notif = {
        id: Date.now(),
        username: data.username || 'Unknown',
        userId: data.userId || '0',
        ip: data.ip || '127.0.0.1',
        model: data.model || 'AirbusA220KITTED',
        time: new Date().toLocaleString(),
        processed: false
    };
    notifications.unshift(notif);
    saveData();
    renderAll();
    console.log('[NOTIFY] Новое уведомление от @' + notif.username);
    return { success: true };
};

window.getWhitelist = function() {
    return whitelist;
};

window.getHello = function() {
    return { message: helloMessage };
};

// ============================================
// ОТОБРАЖЕНИЕ
// ============================================

function renderAll() {
    renderNotifications();
    renderWhitelist();
    renderHello();
    document.getElementById('notifCount').textContent = notifications.length;
}

function renderNotifications() {
    const container = document.getElementById('notifList');
    if (notifications.length === 0) {
        container.innerHTML = '<div class="empty">📭 Нет уведомлений</div>';
        return;
    }
    
    let html = '';
    notifications.forEach((n, i) => {
        const isInWhitelist = whitelist.includes(n.username);
        html += `
            <div class="card ${!isInWhitelist ? 'notification-sound' : ''}">
                <div class="top">
                    <span class="username">
                        @${n.username}
                        ${isInWhitelist ? '<span class="badge">✅ Whitelist</span>' : '<span class="badge no">⚠️ Не в списке</span>'}
                    </span>
                    <span class="time">${n.time}</span>
                </div>
                <div class="details">
                    🚀 Скрипт запущен в Roblox Studio<br>
                    📍 Модель: ${n.model}<br>
                    🖥️ IP: ${n.ip}<br>
                    🆔 UserId: ${n.userId}
                </div>
                <div>
                    <button class="btn btn-yes" onclick="handleAction(${i}, 'yes')">✅ YES</button>
                    <button class="btn btn-no" onclick="handleAction(${i}, 'no')">❌ NO</button>
                </div>
            </div>
        `;
    });
    container.innerHTML = html;
}

function renderWhitelist() {
    const container = document.getElementById('whitelistList');
    if (whitelist.length === 0) {
        container.innerHTML = '<span style="color:#99aabb;">Список пуст</span>';
        return;
    }
    let html = '';
    whitelist.forEach(name => {
        html += `<span class="tag">@${name} <span class="remove" onclick="removeWhitelist('${name}')">✕</span></span>`;
    });
    container.innerHTML = html;
}

function renderHello() {
    document.getElementById('helloInput').value = helloMessage;
    document.getElementById('helloPreview').textContent = helloMessage;
}

// ============================================
// ДЕЙСТВИЯ
// ============================================

function handleAction(index, action) {
    const notif = notifications[index];
    if (!notif) return;
    
    if (action === 'yes') {
        if (!whitelist.includes(notif.username)) {
            whitelist.push(notif.username);
        }
        alert(`✅ ${notif.username} добавлен в whitelist!\n\n📊 Данные:\n👤 ${notif.username}\n🆔 ${notif.userId}\n🌐 ${notif.ip}`);
    } else {
        alert(`❌ Доступ отклонён для ${notif.username}!\n\n🧹 Все скрипты удалены из модели.`);
    }
    
    notif.processed = true;
    saveData();
    renderAll();
}

function addWhitelist() {
    const input = document.getElementById('whitelistInput');
    const name = input.value.trim();
    if (!name) return alert('Введите имя пользователя!');
    if (whitelist.includes(name)) return alert(`${name} уже в whitelist!`);
    whitelist.push(name);
    saveData();
    renderAll();
    input.value = '';
    alert(`✅ ${name} добавлен в whitelist!`);
}

function removeWhitelist(name) {
    if (!confirm(`Удалить ${name} из whitelist?`)) return;
    whitelist = whitelist.filter(n => n !== name);
    saveData();
    renderAll();
}

function saveHello() {
    const input = document.getElementById('helloInput');
    helloMessage = input.value || '👋 Добро пожаловать!';
    saveData();
    renderHello();
    alert('✅ Приветствие сохранено!');
}

// ============================================
// ИНИЦИАЛИЗАЦИЯ
// ============================================

renderAll();
console.log('[CRACKED] Сайт запущен!');
console.log('[CRACKED] Whitelist:', whitelist);
</script>

</body>
</html>
