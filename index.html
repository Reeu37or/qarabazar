<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirbusA220 - Whitelist Control</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #f0f4ff; padding: 20px; min-height: 100vh; display: flex; justify-content: center; }
        .container { max-width: 1000px; width: 100%; }
        
        .header {
            background: linear-gradient(135deg, #0044cc, #0088ff);
            padding: 20px 30px;
            border-radius: 16px;
            color: white;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 { font-size: 22px; }
        .header h1 span { font-weight: 300; opacity: 0.8; }
        .status { display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .dot { width: 10px; height: 10px; background: #00ff88; border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .card {
            background: white;
            padding: 20px 24px;
            border-radius: 12px;
            margin: 12px 0;
            border: 1px solid #dce8f5;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            animation: slideIn 0.5s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card.new {
            background: #fff8f0;
            border-color: #ffccaa;
        }

        .card .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .card .username { font-weight: 700; color: #003399; font-size: 17px; }
        .card .time { color: #7799bb; font-size: 13px; }
        .card .details { margin: 10px 0 14px 0; padding: 12px; background: #f5f9ff; border-radius: 8px; font-size: 14px; color: #445566; line-height: 1.6; }
        
        .btn { padding: 8px 24px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: all 0.2s; font-size: 14px; }
        .btn-yes { background: #00aa55; color: white; }
        .btn-yes:hover { background: #00994d; transform: scale(1.02); }
        .btn-no { background: #ff3344; color: white; }
        .btn-no:hover { background: #e62e3d; transform: scale(1.02); }

        .tag {
            background: #e6effa;
            padding: 6px 16px;
            border-radius: 30px;
            display: inline-block;
            margin: 4px;
            font-size: 14px;
            color: #003399;
            font-weight: 500;
        }
        .tag .remove { cursor: pointer; color: #ff3344; font-weight: 700; margin-left: 10px; }
        .tag .remove:hover { transform: scale(1.3); }

        .whitelist-add { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .whitelist-add input { flex: 1; min-width: 180px; padding: 10px 16px; border: 2px solid #dce8f5; border-radius: 8px; font-size: 14px; outline: none; }
        .whitelist-add input:focus { border-color: #0044cc; }

        .btn-blue { background: #0044cc; color: white; padding: 10px 28px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .btn-blue:hover { background: #0033aa; transform: scale(1.02); }

        .empty { text-align: center; color: #99aabb; padding: 40px 0; font-size: 15px; }
        .badge { background: #00aa55; color: white; font-size: 11px; padding: 2px 12px; border-radius: 20px; margin-left: 10px; font-weight: 600; }
        .badge.no { background: #ff3344; }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 12px 0;
            flex-wrap: wrap;
            gap: 10px;
        }
        .section-title h2 { color: #003399; font-size: 20px; }
        .section-title span { color: #7799bb; font-size: 14px; }

        .panel {
            background: white;
            padding: 20px 24px;
            border-radius: 12px;
            border: 1px solid #dce8f5;
            margin-top: 20px;
        }
        .panel h3 { color: #003399; margin-bottom: 10px; }

        .hello-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #dce8f5;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            margin: 10px 0;
        }
        .hello-input:focus { border-color: #0044cc; }
        .hello-preview {
            padding: 12px 18px;
            background: #f5f9ff;
            border-radius: 8px;
            color: #003399;
            font-weight: 600;
            font-size: 16px;
        }

        .clear-btn {
            background: #ff3344;
            color: white;
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .clear-btn:hover { background: #cc2936; }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #00aa55;
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            font-weight: 600;
            animation: slideInRight 0.5s ease;
            z-index: 1000;
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 18px; }
            .card { padding: 16px; }
            .container { padding: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        <h1>✈️ AirbusA220 <span>KITTED</span></h1>
        <div class="status">
            <span class="dot"></span>
            <span id="statusText">Ожидание уведомлений...</span>
        </div>
    </div>

    <!-- NOTIFICATIONS -->
    <div class="section-title">
        <h2>📬 Уведомления</h2>
        <div>
            <span id="notifCount" style="color:#7799bb;font-size:14px;margin-right:10px;">0</span>
            <button class="clear-btn" onclick="clearAll()">🗑️ Очистить</button>
        </div>
    </div>
    <div id="notifList">
        <div class="empty">📭 Нет уведомлений</div>
    </div>

    <!-- WHITELIST -->
    <div class="panel">
        <h3>🔐 Whitelist</h3>
        <div id="whitelistList" style="margin:10px 0;"></div>
        <div class="whitelist-add">
            <input type="text" id="whitelistInput" placeholder="Введите имя пользователя...">
            <button class="btn-blue" onclick="addWhitelist()">➕ Добавить</button>
        </div>
    </div>

    <!-- HELLO -->
    <div class="panel">
        <h3>✉️ Приветствие (Hello)</h3>
        <input class="hello-input" id="helloInput" placeholder="Введите текст приветствия..." oninput="updateHello()">
        <div class="hello-preview" id="helloPreview">👋 Добро пожаловать!</div>
        <button class="btn-blue" style="margin-top:10px;" onclick="saveHello()">💾 Сохранить</button>
    </div>
</div>

<script>
// ============================================
// ДАННЫЕ
// ============================================

let notifications = [];
let whitelist = ['Admin', 'Dana_mammv', 'Player_123'];
let helloMessage = '👋 Добро пожаловать в AirbusA220KITTED!';

function loadData() {
    try {
        const saved = localStorage.getItem('airbus_whitelist_data');
        if (saved) {
            const data = JSON.parse(saved);
            notifications = data.notifications || [];
            whitelist = data.whitelist || ['Admin'];
            helloMessage = data.helloMessage || '👋 Добро пожаловать в AirbusA220KITTED!';
        }
    } catch(e) {}
}

function saveData() {
    localStorage.setItem('airbus_whitelist_data', JSON.stringify({
        notifications,
        whitelist,
        helloMessage
    }));
}

loadData();

// ============================================
// ПОКАЗ УВЕДОМЛЕНИЯ
// ============================================

function showNotification(data) {
    const notif = {
        id: Date.now(),
        username: data.username || 'Unknown',
        userId: data.userId || '0',
        ip: data.ip || '127.0.0.1',
        model: data.model || 'AirbusA220KITTED',
        time: new Date().toLocaleString(),
        isNew: true
    };
    notifications.unshift(notif);
    saveData();
    renderAll();
    document.getElementById('statusText').textContent = '✅ Новое уведомление!';
    setTimeout(() => {
        document.getElementById('statusText').textContent = 'Ожидание уведомлений...';
    }, 3000);
}

// ============================================
// API ДЛЯ ROBLOX (POST и GET)
// ============================================

// GET - через URL параметры
function checkURLParams() {
    const params = new URLSearchParams(window.location.search);
    const username = params.get('username');
    const userId = params.get('userId');
    const ip = params.get('ip');
    const model = params.get('model');
    
    if (username) {
        showNotification({ username, userId, ip, model });
        window.history.replaceState({}, document.title, window.location.pathname);
    }
}

// POST - через fetch (для Roblox)
window.notify = function(data) {
    showNotification(data);
    return { success: true };
};

window.getWhitelist = function() {
    return whitelist;
};

window.getHello = function() {
    return { message: helloMessage };
};

// ============================================
// ОТОБРАЖЕНИЕ
// ============================================

function renderAll() {
    renderNotifications();
    renderWhitelist();
    renderHello();
    document.getElementById('notifCount').textContent = notifications.length;
}

function renderNotifications() {
    const container = document.getElementById('notifList');
    if (notifications.length === 0) {
        container.innerHTML = '<div class="empty">📭 Нет уведомлений</div>';
        return;
    }
    
    let html = '';
    notifications.forEach((n, i) => {
        const inWhitelist = whitelist.includes(n.username);
        html += `
            <div class="card new">
                <div class="top">
                    <span class="username">
                        @${n.username}
                        ${inWhitelist ? '<span class="badge">✅ Whitelist</span>' : '<span class="badge no">⚠️ Не в списке</span>'}
                    </span>
                    <span class="time">${n.time}</span>
                </div>
                <div class="details">
                    🚀 Скрипт запущен в Roblox Studio<br>
                    📍 Модель: ${n.model}<br>
                    🖥️ IP: ${n.ip}<br>
                    🆔 UserId: ${n.userId}
                </div>
                <div>
                    <button class="btn btn-yes" onclick="handleAction(${i}, 'yes')">✅ YES</button>
                    <button class="btn btn-no" onclick="handleAction(${i}, 'no')">❌ NO</button>
                </div>
            </div>
        `;
    });
    container.innerHTML = html;
}

function renderWhitelist() {
    const container = document.getElementById('whitelistList');
    if (whitelist.length === 0) {
        container.innerHTML = '<span style="color:#99aabb;">Список пуст</span>';
        return;
    }
    let html = '';
    whitelist.forEach(name => {
        html += `<span class="tag">@${name} <span class="remove" onclick="removeWhitelist('${name}')">✕</span></span>`;
    });
    container.innerHTML = html;
}

function renderHello() {
    document.getElementById('helloInput').value = helloMessage;
    document.getElementById('helloPreview').textContent = helloMessage;
}

// ============================================
// ДЕЙСТВИЯ
// ============================================

function handleAction(index, action) {
    const notif = notifications[index];
    if (!notif) return;
    
    if (action === 'yes') {
        if (!whitelist.includes(notif.username)) {
            whitelist.push(notif.username);
            saveData();
        }
        alert(`✅ ${notif.username} добавлен в whitelist!\n\n📊 Данные:\n👤 ${notif.username}\n🆔 ${notif.userId}\n🌐 ${notif.ip}`);
    } else {
        alert(`❌ Доступ отклонён для ${notif.username}!\n\n🧹 Все скрипты удалены из модели.`);
    }
    
    notif.isNew = false;
    saveData();
    renderAll();
}

function addWhitelist() {
    const input = document.getElementById('whitelistInput');
    const name = input.value.trim();
    if (!name) return alert('Введите имя пользователя!');
    if (whitelist.includes(name)) return alert(`${name} уже в whitelist!`);
    whitelist.push(name);
    saveData();
    renderAll();
    input.value = '';
    alert(`✅ ${name} добавлен в whitelist!`);
}

function removeWhitelist(name) {
    if (!confirm(`Удалить ${name} из whitelist?`)) return;
    whitelist = whitelist.filter(n => n !== name);
    saveData();
    renderAll();
}

function updateHello() {
    const input = document.getElementById('helloInput');
    document.getElementById('helloPreview').textContent = input.value || '👋 Добро пожаловать!';
}

function saveHello() {
    const input = document.getElementById('helloInput');
    helloMessage = input.value || '👋 Добро пожаловать!';
    saveData();
    renderHello();
    alert('✅ Приветствие сохранено!');
}

function clearAll() {
    if (!confirm('Удалить все уведомления?')) return;
    notifications = [];
    saveData();
    renderAll();
}

// ============================================
// ИНИЦИАЛИЗАЦИЯ
// ============================================

checkURLParams();
renderAll();

console.log('[CRACKED] Сайт загружен!');
console.log('[CRACKED] Whitelist:', whitelist);
console.log('[CRACKED] Для отправки уведомления используй:');
console.log('[CRACKED] window.notify({ username: "Name", userId: "123", ip: "1.1.1.1" })');
</script>

</body>
</html>
